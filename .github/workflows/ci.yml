name: CI

on:
  pull_request:
  # Lets deploy.yml gate on the exact same checks instead of duplicating them.
  workflow_call:
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qurbot_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: qurbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qurbot_test -d qurbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOT_TOKEN: "123456:CI-TOKEN"
      WEBHOOK_SECRET: "ci-secret"
      REGISTER_WEBHOOK: "false"
      SALES_TEST_DATABASE_URL: postgresql+asyncpg://qurbot_test:ci-only@localhost:5432/qurbot_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select Markdown-only changes
        id: changes
        run: python3 scripts/ci_changed.py >> "$GITHUB_OUTPUT"

      - name: Check Markdown-only patch
        if: steps.changes.outputs.docs_only == 'true'
        run: git diff --check HEAD^ HEAD

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: pip install -e ".[dev]" "playwright==1.63.0"

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        if: steps.changes.outputs.docs_only != 'true'
        run: mypy app

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: pytest -n auto --junitxml=test-results.xml

      - name: Telegram iframe authentication regression
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m scripts.check_embedded_auth

      - name: Report test failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("test-results.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for problem in (*case.findall("failure"), *case.findall("error")):
                      message = f'{case.get("classname")}.{case.get("name")}: {problem.text or problem.get("message", "")}'
                      message = message[:6000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error::{message}")
          PY
