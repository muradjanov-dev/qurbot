name: CI

on:
  pull_request:
  # Lets deploy.yml gate on the exact same checks instead of duplicating them.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qurbot_test
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: qurbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qurbot_test -d qurbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOT_TOKEN: "123456:CI-TOKEN"
      WEBHOOK_SECRET: "ci-secret"
      REGISTER_WEBHOOK: "false"
      SALES_TEST_DATABASE_URL: postgresql+asyncpg://qurbot_test:ci-only@localhost:5432/qurbot_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -n auto
