{% set lang = legacy_lang(request) %}
{% set admin_active = 'settings' %}
<!doctype html>
<html lang="{{ 'ru' if lang == 'ru' else 'uz' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><meta name="theme-color" content="#f6f8f6">
  <title>{% block title %}Tezqur{% endblock %}</title>
  <link rel="stylesheet" href="/static/store/app.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/store/admin.css?v={{ asset_version }}">
  <style>
    .legacy-tools table {min-width:620px} .legacy-tools {overflow-x:auto}
    .legacy-tools button {cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:white;color:var(--ink)}
    .legacy-tools button.approve {background:var(--accent);color:white}.legacy-tools button.reject,.legacy-tools button.deactivate {color:var(--danger)}
    .legacy-tools form.inline {display:inline}.legacy-tools .badge.fresh {background:var(--accent-soft);color:var(--accent)}
    .legacy-tools .badge.aging,.legacy-tools .badge.stale {background:var(--warn-soft);color:var(--warn)}
  </style>
</head>
<body class="admin-layout">
  {% include 'admin_sidebar.html' %}
  <header class="topbar admin-topbar"><div class="topbar-inner"><a href="/manage/settings" class="admin-breadcrumb">← {{ t('ui_settings', lang=lang) }}</a></div></header>
  <main class="page legacy-tools">{% block content %}{% endblock %}</main>
</body>
</html>
